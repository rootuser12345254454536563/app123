name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Java version could not be detected."
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F '.' '{print $1}')
          echo "Detected Java Major Version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "Error: Java version is lower than 17 (found $MAJOR_VER)."
            exit 1
          fi
          echo "Java 17+ environment verified."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Debug keystore ready."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Searching app/build/outputs/apk for any APKs:"
            find app/build/outputs/apk -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *) echo "Error: File does not have .apk extension"; exit 1 ;;
          esac
          echo "Verified APK at $APK_PATH (size: $(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${RUNNER_TEMP:-/tmp}/apk-release-assets"
          mkdir -p "$TEMP_DIR"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$TEMP_DIR/app-debug.apk"
          if [ ! -s "$TEMP_DIR/app-debug.apk" ]; then
            echo "Error: Failed to copy or prepared APK is empty."
            exit 1
          fi
          echo "asset_path=$TEMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset at: $TEMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version || { echo "Error: gh CLI not available"; exit 1; }
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Release asset file not found at $ASSET_PATH"
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset file is empty."
            exit 1
          fi
          ASSET_FILENAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_FILENAME" != "app-debug.apk" ]; then
            echo "Error: Release asset filename must be app-debug.apk, found $ASSET_FILENAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          cat << 'EOF' > release_notes.md
          ### Pukalavan Store — Debug APK Build

          This is an automatically generated debug APK built by GitHub Actions.

          - **Build Run**: #${{ github.run_number }} (Attempt #${{ github.run_attempt }})
          - **Commit**: ${{ github.sha }}
          - **Environment**: Temurin Java 17, Gradle 9.3.1, AGP 9.1.1
          - **Asset**: `app-debug.apk`

          > **Note**: This APK is intended for testing and demonstration only. It is not a Google Play Store production release and is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "=== GitHub Release Details ==="
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "APK Filename: app-debug.apk"

            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Direct Download URL: $DIRECT_URL"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo "Direct download link for the latest APK:"
              echo "[$DIRECT_URL]($DIRECT_URL)"
              echo ""
              echo "> **Backup Artifact**: The standard GitHub Actions artifact \`app-debug-apk\` is also preserved and available under this run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "APK build succeeded. The GitHub Actions artifact 'app-debug-apk' remains available for download from the workflow run summary."
              {
                echo "## APK Build Status"
                echo "APK was built successfully and uploaded as GitHub Actions artifact **app-debug-apk**."
                echo "GitHub Release publishing did not complete."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "APK build was not successful."
            fi
          fi
